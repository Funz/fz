name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # fz is pure Python: one build produces the single py3-none-any wheel and the
  # sdist. The verify job then installs that exact wheel on the CI matrix.
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Stamp commit metadata into fz/_version.py
      run: python scripts/stamp_version.py

    - name: Build wheel and source distribution
      run: |
        python -m build --outdir dist/
        ls -lh dist/

    - name: Check distributions
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        twine check --strict dist/*
        wheels=(dist/*.whl)
        if [ "${#wheels[@]}" -ne 1 ]; then
          echo "::error::expected exactly one wheel, found ${#wheels[@]}"; exit 1
        fi
        case "${wheels[0]}" in
          *-py3-none-any.whl) ;;
          *) echo "::error::wheel is not pure Python: ${wheels[0]}"; exit 1 ;;
        esac
        version=$(basename "${wheels[0]}" | cut -d- -f2)
        echo "Built version: $version"
        if [ -n "$TAG_NAME" ] && [ "${TAG_NAME#v}" != "$version" ]; then
          echo "::error::release tag '$TAG_NAME' does not match fz.__version__ '$version' (fz/__init__.py)"
          exit 1
        fi

    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 90

  verify:
    name: Verify wheel on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same matrix as ci.yml
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: windows-latest
            python-version: '3.9'

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Install the wheel
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install dist/*.whl

    - name: Smoke test
      shell: bash
      run: |
        version=$(basename dist/*.whl | cut -d- -f2)
        out=$(fz --version)
        echo "$out"
        if [ "$out" != "fz $version" ]; then
          echo "::error::'fz --version' printed '$out', expected 'fz $version'"; exit 1
        fi
        mkdir smoke && cd smoke
        python - <<'PY'
        import platform
        from pathlib import Path
        import fz, fz.runners

        Path("input.txt").write_text("x = $(x)\n")
        Path("run.sh").write_text("cut -d= -f2 input.txt > y.txt\n")
        model = {"varprefix": "$", "delim": "()", "output": {"y": "cat y.txt"}}
        assert fz.fzi("input.txt", model) == {"x": None}
        fz.fzc("input.txt", {"x": [1, 2]}, model, output_dir="compiled")
        assert sorted(p.name for p in Path("compiled").iterdir()) == ["x=1", "x=2"]
        if platform.system() != "Windows":  # sh:// needs bash (MSYS2 on Windows)
            df = fz.fzr("input.txt", {"x": [1, 2]}, model,
                        calculators="sh://bash run.sh",
                        results_dir="results")
            assert list(df["status"]) == ["done", "done"], df
            assert [float(v) for v in df["y"]] == [1.0, 2.0], df
        print("smoke test passed:", fz.__version__)
        PY

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/project/funz-fz
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: List distributions
      run: ls -lh dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        verbose: true

  publish-to-github:
    name: Publish to GitHub Releases
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: List distributions
      run: ls -lh dist/

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
