name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Wrapper tests (mock launchers + output fixtures)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install fz
      run: pip install git+https://github.com/Funz/fz.git pytest
    - name: Check shell scripts
      run: for f in .fz/calculators/*.sh tests/mock/*; do bash -n "$f"; done
    - name: Run tests
      run: pytest tests/ -v
